name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package SnapBack.spoon
        run: |
          zip -r SnapBack.spoon.zip SnapBack.spoon/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SnapBack ${{ steps.version.outputs.tag }}
          body: |
            ## Installation

            1. Download **SnapBack.spoon.zip** from the assets below and unzip it.
            2. Double-click `SnapBack.spoon` to install it (Hammerspoon will handle this automatically).
            3. Or manually move `SnapBack.spoon` to `~/.hammerspoon/Spoons/`.
            4. Add the following to your `~/.hammerspoon/init.lua`:

            ```lua
            hs.loadSpoon("SnapBack")
            spoon.SnapBack:start()
            ```

            5. Reload Hammerspoon.
          files: SnapBack.spoon.zip
          generate_release_notes: true
