name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Syntax check
        run: find . -name '*.lua' -not -path './.git/*' -exec luac5.4 -p {} +

      - name: Run test suite
        run: lua5.4 tests/run.lua
